[pytest]
testpaths = addons tools
norecursedirs = .git __pycache__ .venv build dist .pytest_cache addons/template
pythonpath =
    addons/algovoi-doc-archive-mirror/src
    addons/algovoi-doc-archive-inmodule/src
    addons/algovoi-doc-archive-azure-blob/src
    addons/algovoi-doc-archive-azure-kv/src
    tools
addopts = -q
# The shipped test doubles warn on construction so an operator cannot wire one into production by
# accident. Every test constructs them legitimately, so the warning is filtered here; the tests that
# assert it use pytest.warns, which overrides these filters.
filterwarnings =
    ignore:InMemoryContainerClient is a test double.*:UserWarning
    ignore:LocalRsaCryptoClient is a test double.*:UserWarning
