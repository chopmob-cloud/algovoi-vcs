[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-doc-archive-addon-example"
version = "0.1.0"
description = "Template addon for the AlgoVoi Verifiable Archive engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Always declare the engine: the resolver must install it first, and this states the
# version whose Protocols you built against.
dependencies = ["algovoi-doc-archive>=0.1.6"]

[project.optional-dependencies]
# Put your provider's SDK here, never in the base dependencies — an addon that hard-depends
# on boto3 forces it on every user, including those who chose a different backend.
aws = ["boto3>=1.34"]

[tool.hatch.build.targets.wheel]
packages = ["src/algovoi_doc_archive_addon_example"]
