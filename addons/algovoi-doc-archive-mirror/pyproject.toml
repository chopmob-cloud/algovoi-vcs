[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-doc-archive-mirror"
version = "0.1.0"
description = "Mirror storage backend for the AlgoVoi Verifiable Archive: fan writes out to several backends and fail closed below quorum"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/algovoi_doc_archive_mirror"]
